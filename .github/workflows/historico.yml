name: Gravar histórico da apuração

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar resultado do TSE e acrescentar ponto
        run: node scripts/record.mjs
      - name: Commit se mudou
        run: |
          if git diff --quiet -- data/historico.json; then echo "sem mudança"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json
          git commit -m "histórico: $(date -u +%H:%M) UTC"
          git pull --rebase origin main
          git push
